name: Release

on:
  push:
    branches: ["main"]

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    environment:
      name: production

    defaults:
      run:
        working-directory: app

    permissions:
      contents: read

    env:
      FLUTTER_VERSION: "3.41.9"
      JAVA_VERSION: "21"

    steps:

      # ============================================================
      # 1. Checkout private Flutter repository
      # ============================================================

      - name: Checkout private Flutter repository
        uses: actions/checkout@v6
        with:
          repository: ${{ secrets.SECRET_NAME }}/${{ secrets.REPO }}
          ref: main
          token: ${{ secrets.REPO_T }}
          # path: app


      # ============================================================
      # 2. Setup Flutter
      # ============================================================

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true


      # ============================================================
      # 3. Restore Flutter packages
      # ============================================================

      - name: Restore pub packages
        run: flutter pub get


      # ============================================================
      # 4. Create production environment file
      # ============================================================

      - name: Create .env.prod
        run: |
          cat > .env.prod << EOF
          COGNITO_CLIENT_ID=${{ secrets.COGNITO_CLIENT_ID }}
          COGNITO_REDIRECT_URL=${{ secrets.COGNITO_REDIRECT_URL }}
          COGNITO_LOGOUT_URI=${{ secrets.COGNITO_LOGOUT_URI }}
          COGNITO_DOMAIN=${{ secrets.COGNITO_DOMAIN }}
          EOF


      # ============================================================
      # 5. Analyze project
      # ============================================================

      # - name: Analyze project
      #   run: |
      #     flutter analyze --no-fatal-infos


      # ============================================================
      # 6. Run tests
      # ============================================================

      # - name: Run tests
      #   run: flutter test


      # ============================================================
      # 7. Install CocoaPods
      # ============================================================

      - name: Install CocoaPods
        working-directory: app/ios
        run: pod install


      # ============================================================
      # 8. Create temporary signing keychain
      # ============================================================

      - name: Create temporary keychain
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |

          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo "=========================================="
          echo "Creating temporary keychain"
          echo "=========================================="

          echo "Keychain path:"
          echo "$KEYCHAIN_PATH"

          # Remove an existing keychain if present
          security delete-keychain \
            "$KEYCHAIN_PATH" \
            2>/dev/null || true

          # Create keychain
          security create-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          # Keep keychain unlocked for 6 hours
          security set-keychain-settings \
            -lut 21600 \
            "$KEYCHAIN_PATH"

          # Unlock keychain
          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          # Add temporary keychain to search list
          security list-keychains \
            -d user \
            -s \
            "$KEYCHAIN_PATH" \
            "$HOME/Library/Keychains/login.keychain-db"

          # Make temporary keychain default
          security default-keychain \
            -s "$KEYCHAIN_PATH"

          echo ""
          echo "Current keychains:"
          security list-keychains

          echo ""
          echo "Default keychain:"
          security default-keychain


      # ============================================================
      # 9. Install Apple Distribution certificate
      # ============================================================

      - name: Install Apple Distribution certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BC_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |

          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"

          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo "=========================================="
          echo "Decoding Apple Distribution certificate"
          echo "=========================================="

          echo -n "$BUILD_CERTIFICATE_BASE64" \
            | base64 --decode \
            -o "$CERTIFICATE_PATH"

          echo ""
          echo "Certificate file:"
          ls -lh "$CERTIFICATE_PATH"

          echo ""
          echo "=========================================="
          echo "Importing certificate"
          echo "=========================================="

          security import \
            "$CERTIFICATE_PATH" \
            -P "$P12_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          echo ""
          echo "=========================================="
          echo "Configuring private key access"
          echo "=========================================="

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          # Unlock again after import
          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"


      # ============================================================
      # 10. Verify Apple signing identity
      # ============================================================

      - name: Verify Apple signing identity
        run: |

          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo "=========================================="
          echo "Apple signing identities"
          echo "=========================================="

          security find-identity \
            -v \
            -p codesigning \
            "$KEYCHAIN_PATH"

          echo ""
          echo "=========================================="
          echo "All available signing identities"
          echo "=========================================="

          security find-identity \
            -v \
            -p codesigning


      # ============================================================
      # 11. Install provisioning profile
      # ============================================================

      - name: Install provisioning profile
        env:
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.B_PROVISION_PROFILE_BASE64 }}
        run: |

          PP_PATH="$RUNNER_TEMP/build_pp.mobileprovision"

          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"

          echo "=========================================="
          echo "Installing provisioning profile"
          echo "=========================================="

          mkdir -p "$PROFILE_DIR"

          echo -n "$BUILD_PROVISION_PROFILE_BASE64" \
            | base64 --decode \
            -o "$PP_PATH"

          echo ""
          echo "Provisioning profile file:"
          ls -lh "$PP_PATH"

          cp \
            "$PP_PATH" \
            "$PROFILE_DIR/"

          echo ""
          echo "Installed provisioning profiles:"
          ls -la "$PROFILE_DIR"


      # ============================================================
      # 12. Verify provisioning profile
      # ============================================================

      - name: Verify provisioning profile
        run: |

          PP_PATH="$RUNNER_TEMP/build_pp.mobileprovision"

          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"

          echo "=========================================="
          echo "Reading provisioning profile"
          echo "=========================================="

          security cms \
            -D \
            -i "$PP_PATH" \
            > "$PROFILE_PLIST"

          echo ""
          echo "Provisioning profile name:"

          /usr/libexec/PlistBuddy \
            -c "Print :Name" \
            "$PROFILE_PLIST"

          echo ""
          echo "Application identifier:"

          /usr/libexec/PlistBuddy \
            -c "Print :Entitlements:application-identifier" \
            "$PROFILE_PLIST"

          echo ""
          echo "Team identifier:"

          /usr/libexec/PlistBuddy \
            -c "Print :Entitlements:com.apple.developer.team-identifier" \
            "$PROFILE_PLIST"


      # ============================================================
      # 13. Check Flutter/Xcode Bundle ID
      # ============================================================

      - name: Check iOS Bundle ID
        run: |

          echo "=========================================="
          echo "PRODUCT_BUNDLE_IDENTIFIER"
          echo "=========================================="

          grep \
            "PRODUCT_BUNDLE_IDENTIFIER" \
            ios/Runner.xcodeproj/project.pbxproj


      # ============================================================
      # 14. Check Development Team
      # ============================================================

      - name: Check Development Team
        run: |

          echo "=========================================="
          echo "DEVELOPMENT_TEAM"
          echo "=========================================="

          grep \
            "DEVELOPMENT_TEAM" \
            ios/Runner.xcodeproj/project.pbxproj \
            || true


      # ============================================================
      # 15. Check Xcode signing environment
      # ============================================================

      - name: Check Xcode signing environment
        run: |

          echo "=========================================="
          echo "Xcode version"
          echo "=========================================="

          xcodebuild -version

          echo ""
          echo "=========================================="
          echo "Code signing identities"
          echo "=========================================="

          security find-identity \
            -v \
            -p codesigning

          echo ""
          echo "=========================================="
          echo "Provisioning profiles"
          echo "=========================================="

          ls -la \
            "$HOME/Library/MobileDevice/Provisioning Profiles"


      - name: Verify Release signing configuration
        working-directory: app
        run: |
      
          echo "=========================================="
          echo "Release signing configuration"
          echo "=========================================="
      
          xcodebuild \
            -project ios/Runner.xcodeproj \
            -target Runner \
            -configuration Release \
            -showBuildSettings \
            | grep -E \
              "PRODUCT_BUNDLE_IDENTIFIER|DEVELOPMENT_TEAM|CODE_SIGN_STYLE|CODE_SIGN_IDENTITY|PROVISIONING_PROFILE_SPECIFIER"

        
      # ============================================================
      # 16. Build IPA
      # ============================================================

      - name: Build iOS IPA
        run: |

          echo "=========================================="
          echo "Building iOS IPA"
          echo "=========================================="

          flutter build ipa \
            --release \
            --export-method app-store


      # # ============================================================
      # # 17. Verify IPA
      # # ============================================================

      # - name: Verify IPA
      #   run: |

      #     echo "=========================================="
      #     echo "Generated IPA"
      #     echo "=========================================="

      #     ls -lah build/ios/ipa/


