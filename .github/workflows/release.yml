name: Release

on:
  push:
    branches: [ "main" ]
  
  workflow_dispatch:

permissions: 
  contents: read


jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    environment:
      name: production

    defaults:
      run:
        working-directory: app

    permissions:
      contents: read

    env:
      FLUTTER_VERSION: "3.41.9"
      JAVA_VERSION: "21"


    steps:
        
      - name: Checkout private Flutter repository
        uses: actions/checkout@v6
        with: 
          repository: ${{ secrets.SECRET_NAME }}/${{ secrets.REPO }}
          ref: main
          token: ${{ secrets.REPO_T }}
          # path: app


      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true



      - name: Show macOS version
        run: sw_vers

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Show Swift version
        run: swift --version

      - name: Show Flutter version
        run: flutter --version || true
        



      - name: Create private key
        run: |
          openssl genrsa \
            -out "$RUNNER_TEMP/distribution_private.key" \
            2048

      - name: Create CSR
        run: |
          openssl req \
            -new \
            -key "$RUNNER_TEMP/distribution_private.key" \
            -out "$RUNNER_TEMP/distribution.certSigningRequest" \
            -subj "/emailAddress=sau007007@gmail.com/CN=Omrath Distribution/C=IN"

      - name: Package signing request
        run: |
          cd "$RUNNER_TEMP"

          zip \
            signing-request.zip \
            distribution_private.key \
            distribution.certSigningRequest

      - name: Upload signing request
        uses: actions/upload-artifact@v4
        with:
          name: ios-signing-request
          path: ${{ runner.temp }}/signing-request.zip
          retention-days: 1

          

